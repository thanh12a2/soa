syntax = "proto3";

package medication;

option java_package = "com.healthcare.medication";
option java_outer_classname = "MedicationProto";

// -------------------------------------------------------
// gRPC — internal service-to-service
// -------------------------------------------------------
service MedicationService {
  rpc GetMedicationSchedule(GetScheduleRequest) returns (MedicationScheduleResponse);
}

message GetScheduleRequest {
  string schedule_id = 1;
}

message MedicationScheduleResponse {
  string id = 1;
  string prescription_item_id = 2;
  string scheduled_time = 3;
  string schedule_date = 4;
  string status = 5;      // PENDING, CONFIRMED, MISSED
  string confirmed_at = 6;
}

// -------------------------------------------------------
// Kafka Events
// -------------------------------------------------------

// Topic: appointment_report.created
// Producer: Appointment Service
// Consumer: Medication Service
// Action: creates MedicationSchedule for each PrescriptionItem in the Prescription
message AppointmentReportCreatedEvent {
  string appointment_report_id = 1;
  string prescription_id = 2;
  string patient_id = 3;
  string created_at = 4;
}

// Topic: medication_schedule.due
// Producer: Medication Service
// Consumer: Notification Service
// Action: triggers reminder notification to patient at scheduled time
message MedicationScheduleDueEvent {
  string schedule_id = 1;
  string patient_id = 2;
  string medication_name = 3;
  string scheduled_time = 4;
  string schedule_date = 5;
}

// Topic: medication_schedule.missed
// Producer: Medication Service
// Consumer: Notification Service
// Action: alerts doctor when patient misses a scheduled medication or dressing change
message MedicationScheduleMissedEvent {
  string schedule_id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string medication_name = 4;
  string scheduled_time = 5;
  string schedule_date = 6;
}
